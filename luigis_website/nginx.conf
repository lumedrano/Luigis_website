server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}